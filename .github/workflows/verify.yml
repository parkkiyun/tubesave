name: Verify TubeSave source
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run source tests
        run: node --test
      - name: Check script syntax
        shell: bash
        run: |
          find app build scripts tests -type f \( -name '*.cjs' -o -name '*.js' \) -print0 | xargs -0 -n1 node --check
          bash -n install_mac.command scripts/setup-mac-signing.sh
  dependencies:
    needs: tests
    if: github.repository == 'parkkiyun/tubesave' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate missing lockfiles without running package scripts
        id: locks
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json && -f app/package-lock.json ]]; then
            echo 'generated=false' >> "$GITHUB_OUTPUT"
          else
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
            npm install --prefix app --package-lock-only --ignore-scripts --no-audit --no-fund
            echo 'generated=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Verify locked dependency installation
        shell: bash
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix app --ignore-scripts --no-audit --no-fund
          node -e "const p=require('./node_modules/electron/package.json'); console.log('Electron npm package:',p.version); console.log('Builder:',require('electron-builder/package.json').version); console.log('Updater:',require('./app/node_modules/electron-updater/package.json').version)"
          node --test
      - name: Save dependency audit reports
        if: always()
        shell: bash
        run: |
          mkdir -p ci-results
          npm audit --json > ci-results/build-audit.json || true
          npm audit --prefix app --omit=dev --json > ci-results/app-audit.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-review-${{ github.run_id }}
          path: |
            package-lock.json
            app/package-lock.json
            ci-results/*.json
          retention-days: 14
      - name: Commit generated locks to a review branch only
        if: success() && steps.locks.outputs.generated == 'true'
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          BRANCH="automation/dependency-locks-$RUN_ID"
          git switch -c "$BRANCH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package-lock.json app/package-lock.json
          git diff --cached --name-only
          git commit -m 'build: generate dependency locks for review'
          git push origin "HEAD:refs/heads/$BRANCH"
          printf '## Dependency lockfiles ready for review\n\nBranch: `%s`\n\nNo automatic merge or release was performed.\n' "$BRANCH" >> "$GITHUB_STEP_SUMMARY"
