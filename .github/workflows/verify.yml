name: Verify TubeSave source
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: node scripts/check-source.cjs && node scripts/check-lockfiles.cjs
      - run: npm test
      - name: Check JavaScript and installer syntax
        shell: bash
        run: |
          find app build scripts tests -type f \( -name '*.cjs' -o -name '*.js' \) -print0 | xargs -0 -n1 node --check
          bash -n install_mac.command scripts/setup-mac-signing.sh
      - name: Verify locked dependency graph without lifecycle scripts
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix app --ignore-scripts --no-audit --no-fund
      - name: Record dependency audit results
        shell: bash
        run: |
          mkdir -p ci-results
          npm audit --json > ci-results/build-audit.json || true
          npm audit --prefix app --omit=dev --json > ci-results/app-audit.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-audits-${{ github.run_id }}
          path: ci-results/*audit.json
          retention-days: 14
